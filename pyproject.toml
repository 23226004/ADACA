[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodocs"
version = "0.1.0"
description = "AI Harness Engineering Standard engine — init / adopt / audit / check"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autodocs = "autodocs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autodocs"]

# 표준(SSOT)은 저장소 루트 standard/ 한 곳에만 둔다. 패키징 시에만 복사한다.
[tool.hatch.build.targets.wheel.force-include]
"standard" = "autodocs/standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
